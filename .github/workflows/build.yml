name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CONFIGURE: >-
    -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
    -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
    -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      WINLIBS_RELEASE: 15.2.0posix-14.0.0-ucrt-r7
      WINLIBS_ZIP: winlibs-x86_64-posix-seh-gcc-15.2.0-mingw-w64ucrt-14.0.0-r7.zip
      SSL_CERT_FILE: C:\Program Files\Git\mingw64\etc\ssl\certs\ca-bundle.crt
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - id: toolchain
        uses: actions/cache@v4
        with:
          path: C:\winlibs
          key: ${{ env.WINLIBS_ZIP }}

      - if: steps.toolchain.outputs.cache-hit != 'true'
        run: |
          curl -sSfL -o "$RUNNER_TEMP/winlibs.zip" "https://github.com/brechtsanders/winlibs_mingw/releases/download/$WINLIBS_RELEASE/$WINLIBS_ZIP"
          7z x "$RUNNER_TEMP/winlibs.zip" -oC:/winlibs > /dev/null

      - run: echo 'C:\winlibs\mingw64\bin' >> "$GITHUB_PATH"

      - uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: windows
          save: true
          evict-old-files: job

      - shell: cmd
        run: |
          if not exist "%SSL_CERT_FILE%" set "SSL_CERT_FILE=C:\Program Files\Git\ucrt64\etc\ssl\certs\ca-bundle.crt"
          cmake -S . -B build %CONFIGURE%

      - shell: cmd
        run: cmake --build build --parallel

      - shell: cmd
        run: cmake --build build --target libs --parallel

      - name: Dosyalari Paketle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "release_pkg/libs"
          Copy-Item "build/core/relinker/relinker.exe" -Destination "release_pkg/"
          Copy-Item "build/core/libs/libs/*" -Destination "release_pkg/libs/" -Recurse

      - name: Artifact Olarak Yukle
        uses: actions/upload-artifact@v4
        with:
          name: AnyPS5Wolverine-Windows
          path: release_pkg/
